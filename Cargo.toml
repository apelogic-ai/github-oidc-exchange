[package]
name = "github-oidc-exchange"
version = "0.4.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[features]
default = []
test-support = []

[dependencies]
axum = "0.8.8"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
base64 = "0.22.1"
chrono = { version = "0.4.44", default-features = false, features = ["clock", "serde"] }
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["rust_crypto"] }
p256 = { version = "0.13.2", features = ["ecdsa", "pkcs8"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls-webpki-roots-no-provider"] }
rsa = { version = "0.9.10", features = ["pem"] }
rustls = { version = "0.23.43", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.8", features = ["set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.21.0", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1.3"
rand = "0.8.5"
tempfile = "3.27.0"

[[test]]
name = "security"
path = "tests/security.rs"
required-features = ["test-support"]

[[test]]
name = "browser_hop1_contract"
path = "tests/browser_hop1_contract.rs"
required-features = ["test-support"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
