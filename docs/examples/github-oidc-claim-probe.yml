# Copy this file to .github/workflows/identity-claim-probe.yml in a private,
# access-restricted workflow repository. It is enrollment tooling,
# not a permanent production workflow.
name: Observe GitHub OIDC claims for Identity enrollment

on:
  workflow_call:
    inputs:
      identity-exchange-audience:
        description: Exact GitHub OIDC audience configured in Identity
        required: true
        type: string

permissions: {}

jobs:
  claims:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Write allowlisted claims to the restricted job summary
        shell: bash
        env:
          IDENTITY_AUDIENCE: ${{ inputs.identity-exchange-audience }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          source_jwt="$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$IDENTITY_AUDIENCE" | jq -er .value)"
          printf '%s' "$source_jwt" | node -e '
            let token = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", chunk => token += chunk);
            process.stdin.on("end", () => {
              const payload = JSON.parse(Buffer.from(token.split(".")[1], "base64url"));
              const names = [
                "iss", "aud", "sub", "repository", "repository_owner_id",
                "repository_id", "actor", "actor_id", "ref", "event_name",
                "sha", "run_id", "run_attempt", "workflow_ref", "workflow_sha",
                "job_workflow_ref", "job_workflow_sha"
              ];
              const selected = Object.fromEntries(names.map(name => [name, payload[name]]));
              process.stdout.write(JSON.stringify(selected, null, 2) + "\n");
            });
          ' > "$RUNNER_TEMP/identity-claims.json"
          unset source_jwt
          {
            printf '### Allowlisted GitHub OIDC claims\n\n```json\n'
            cat "$RUNNER_TEMP/identity-claims.json"
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$RUNNER_TEMP/identity-claims.json"
