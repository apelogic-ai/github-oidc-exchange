image:
  repository: registry.example.invalid/platform/github-oidc-exchange
  digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

config:
  issuerUrl: https://identity.example.invalid
  githubExchangeAudience: example-identity-exchange
  policyConfigMapName: example-policy
  keyringSecretName: example-keyring

rolloutRevisions:
  githubPolicy: rev-1
  githubKeyring: rev-1
  browserHop1Jwks: ""

networkPolicy:
  ingressCidrs:
    - 10.0.0.0/16

ingress:
  enabled: true
  host: identity.example.invalid
