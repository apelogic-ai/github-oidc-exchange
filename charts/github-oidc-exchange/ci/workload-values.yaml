image:
  repository: registry.test.invalid/platform/github-oidc-exchange
  digest: sha256:ef41cf1cf5d7f8b182e985f609884f6409d9d49ebc8a5164f7b76faf8f806dc1

config:
  issuerUrl: https://identity.test.invalid
  githubExchangeAudience: ci-identity-exchange
  policyConfigMapName: github-oidc-exchange-policy
  keyringSecretName: github-oidc-exchange-keyring

rolloutRevisions:
  githubPolicy: rev-1
  githubKeyring: rev-1
  workloadPolicy: rev-1
  workloadRsaKeyring: rev-1
  workloadTls: rev-1

workloadExchange:
  enabled: true
  inputAudience: example-workload-exchange
  outputAudience: openshell-api
  policyConfigMapName: github-oidc-exchange-workload-policy
  rsaKeyringSecretName: github-oidc-exchange-workload-rsa-keyring
  tls:
    secretName: github-oidc-exchange-server-tls
  networkPolicy:
    callerNamespaceSelector:
      kubernetes.io/metadata.name: example-caller
    callerPodSelector:
      app.kubernetes.io/name: example-caller

service:
  port: 8080

ingress:
  enabled: true
  className: test-ingress
  host: identity.test.invalid
  tls:
    secretName: identity-public-tls

serviceMonitor:
  enabled: true

networkPolicy:
  ingressCidrs:
    - 10.0.0.0/16
  metricsNamespaceSelector:
    kubernetes.io/metadata.name: monitoring
  metricsPodSelector:
    app.kubernetes.io/name: prometheus
