apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "github-oidc-exchange.name" . }}-replay-ledger
  labels:
    {{- include "github-oidc-exchange.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "get", "update", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "github-oidc-exchange.name" . }}-replay-ledger
  labels:
    {{- include "github-oidc-exchange.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "github-oidc-exchange.name" . }}-replay-ledger
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
