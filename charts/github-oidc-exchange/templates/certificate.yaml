{{- if and .Values.ingress.enabled .Values.ingress.tls.certManager.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "github-oidc-exchange.name" . }}-public
  labels:
    {{- include "github-oidc-exchange.labels" . | nindent 4 }}
spec:
  secretName: {{ .Values.ingress.tls.secretName }}
  dnsNames:
    - {{ .Values.ingress.host | quote }}
  issuerRef:
    name: {{ required "ingress.tls.certManager.issuerRef.name is required" .Values.ingress.tls.certManager.issuerRef.name }}
    kind: {{ .Values.ingress.tls.certManager.issuerRef.kind }}
    group: {{ .Values.ingress.tls.certManager.issuerRef.group }}
{{- end }}
{{- if and .Values.workloadExchange.enabled .Values.workloadExchange.tls.certManager.enabled }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "github-oidc-exchange.name" . }}-workload
  labels:
    {{- include "github-oidc-exchange.labels" . | nindent 4 }}
spec:
  secretName: {{ .Values.workloadExchange.tls.secretName }}
  dnsNames:
    - {{ printf "%s.%s.svc.cluster.local" (include "github-oidc-exchange.name" .) .Release.Namespace | quote }}
  issuerRef:
    name: {{ required "workloadExchange.tls.certManager.issuerRef.name is required" .Values.workloadExchange.tls.certManager.issuerRef.name }}
    kind: {{ .Values.workloadExchange.tls.certManager.issuerRef.kind }}
    group: {{ .Values.workloadExchange.tls.certManager.issuerRef.group }}
{{- end }}
