{{- include "github-oidc-exchange.validateImageDigest" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "github-oidc-exchange.name" . }}
  labels:
    {{- include "github-oidc-exchange.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "github-oidc-exchange.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "github-oidc-exchange.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/github-policy: {{ printf "%s:%s:%s" .Values.config.policyConfigMapName .Values.config.policyConfigMapKey .Values.rolloutRevisions.githubPolicy | sha256sum | quote }}
        checksum/github-keyring: {{ printf "%s:%s:%s" .Values.config.keyringSecretName .Values.config.keyringSecretKey .Values.rolloutRevisions.githubKeyring | sha256sum | quote }}
        {{- if .Values.workloadExchange.enabled }}
        checksum/workload-policy: {{ printf "%s:%s:%s" .Values.workloadExchange.policyConfigMapName .Values.workloadExchange.policyConfigMapKey .Values.rolloutRevisions.workloadPolicy | sha256sum | quote }}
        checksum/workload-rsa-keyring: {{ printf "%s:%s:%s" .Values.workloadExchange.rsaKeyringSecretName .Values.workloadExchange.rsaKeyringSecretKey .Values.rolloutRevisions.workloadRsaKeyring | sha256sum | quote }}
        checksum/workload-tls: {{ printf "%s:%s:%s:%s" .Values.workloadExchange.tls.secretName .Values.workloadExchange.tls.certificateKey .Values.workloadExchange.tls.privateKeyKey .Values.rolloutRevisions.workloadTls | sha256sum | quote }}
        {{- end }}
        {{- if .Values.browserHop1.enabled }}
        checksum/browser-hop1-steward-jwks: {{ printf "%s:%s:%s" .Values.browserHop1.stewardJwksConfigMapName .Values.browserHop1.stewardJwksConfigMapKey .Values.rolloutRevisions.browserHop1Jwks | sha256sum | quote }}
        {{- end }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      automountServiceAccountToken: true
      enableServiceLinks: false
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exchange
          image: {{ required "image.repository is required" .Values.image.repository }}{{- with .Values.image.tag }}:{{ . }}{{- end }}@{{ required "image.digest is required" .Values.image.digest }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- if .Values.workloadExchange.enabled }}
            - name: workload-https
              containerPort: 8443
              protocol: TCP
            {{- end }}
          env:
            - name: ISSUER_URL
              value: {{ required "config.issuerUrl is required" .Values.config.issuerUrl | quote }}
            - name: GITHUB_EXCHANGE_AUDIENCE
              value: {{ required "config.githubExchangeAudience is required" .Values.config.githubExchangeAudience | quote }}
            - name: OUTPUT_AUDIENCE
              value: {{ .Values.config.outputAudience | quote }}
            - name: REPLAY_LEASE_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: POLICY_FILE
              value: /etc/github-oidc-exchange/policy/policy.json
            - name: KEYRING_FILE
              value: /etc/github-oidc-exchange/keyring/keyring.json
            - name: RUST_LOG
              value: github_oidc_exchange=info
            - name: LISTEN_ADDRESS
              value: 0.0.0.0:8080
            {{- if .Values.workloadExchange.enabled }}
            - name: WORKLOAD_EXCHANGE_ENABLED
              value: "true"
            - name: WORKLOAD_INPUT_AUDIENCE
              value: {{ required "workloadExchange.inputAudience is required" .Values.workloadExchange.inputAudience | quote }}
            - name: WORKLOAD_OUTPUT_AUDIENCE
              value: {{ .Values.workloadExchange.outputAudience | quote }}
            - name: WORKLOAD_POLICY_FILE
              value: /etc/github-oidc-exchange/workload-policy/workload-policy.json
            - name: WORKLOAD_RSA_KEYRING_FILE
              value: /etc/github-oidc-exchange/rsa-keyring/rsa-keyring.json
            - name: TLS_CERTIFICATE_FILE
              value: /etc/github-oidc-exchange/tls/tls.crt
            - name: TLS_PRIVATE_KEY_FILE
              value: /etc/github-oidc-exchange/tls/tls.key
            - name: WORKLOAD_LISTEN_ADDRESS
              value: 0.0.0.0:8443
            {{- end }}
            {{- if .Values.browserHop1.enabled }}
            - name: BROWSER_HOP1_ENABLED
              value: "true"
            - name: BROWSER_HOP1_STEWARD_ISSUER
              value: {{ required "browserHop1.stewardIssuer is required" .Values.browserHop1.stewardIssuer | quote }}
            - name: BROWSER_HOP1_ASSERTION_AUDIENCE
              value: {{ required "browserHop1.assertionAudience is required" .Values.browserHop1.assertionAudience | quote }}
            - name: BROWSER_HOP1_STEWARD_JWKS_FILE
              value: /etc/github-oidc-exchange/browser-hop1-steward-jwks/jwks.json
            - name: BROWSER_HOP1_OUTPUT_AUDIENCE
              value: {{ required "browserHop1.outputAudience is required" .Values.browserHop1.outputAudience | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
              scheme: HTTP
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: policy
              mountPath: /etc/github-oidc-exchange/policy
              readOnly: true
            - name: keyring
              mountPath: /etc/github-oidc-exchange/keyring
              readOnly: true
            {{- if .Values.workloadExchange.enabled }}
            - name: workload-policy
              mountPath: /etc/github-oidc-exchange/workload-policy
              readOnly: true
            - name: rsa-keyring
              mountPath: /etc/github-oidc-exchange/rsa-keyring
              readOnly: true
            - name: tls
              mountPath: /etc/github-oidc-exchange/tls
              readOnly: true
            {{- end }}
            {{- if .Values.browserHop1.enabled }}
            - name: browser-hop1-steward-jwks
              mountPath: /etc/github-oidc-exchange/browser-hop1-steward-jwks
              readOnly: true
            {{- end }}
      volumes:
        - name: policy
          configMap:
            name: {{ required "config.policyConfigMapName is required" .Values.config.policyConfigMapName }}
            defaultMode: 0440
            items:
              - key: {{ .Values.config.policyConfigMapKey }}
                path: policy.json
        - name: keyring
          secret:
            secretName: {{ required "config.keyringSecretName is required" .Values.config.keyringSecretName }}
            defaultMode: 0400
            items:
              - key: {{ .Values.config.keyringSecretKey }}
                path: keyring.json
        {{- if .Values.workloadExchange.enabled }}
        - name: workload-policy
          configMap:
            name: {{ required "workloadExchange.policyConfigMapName is required" .Values.workloadExchange.policyConfigMapName }}
            defaultMode: 0440
            items:
              - key: {{ .Values.workloadExchange.policyConfigMapKey }}
                path: workload-policy.json
        - name: rsa-keyring
          secret:
            secretName: {{ required "workloadExchange.rsaKeyringSecretName is required" .Values.workloadExchange.rsaKeyringSecretName }}
            defaultMode: 0400
            items:
              - key: {{ .Values.workloadExchange.rsaKeyringSecretKey }}
                path: rsa-keyring.json
        - name: tls
          secret:
            secretName: {{ required "workloadExchange.tls.secretName is required" .Values.workloadExchange.tls.secretName }}
            defaultMode: 0400
            items:
              - key: {{ .Values.workloadExchange.tls.certificateKey }}
                path: tls.crt
              - key: {{ .Values.workloadExchange.tls.privateKeyKey }}
                path: tls.key
        {{- end }}
        {{- if .Values.browserHop1.enabled }}
        - name: browser-hop1-steward-jwks
          configMap:
            name: {{ required "browserHop1.stewardJwksConfigMapName is required" .Values.browserHop1.stewardJwksConfigMapName }}
            defaultMode: 0440
            items:
              - key: {{ .Values.browserHop1.stewardJwksConfigMapKey }}
                path: jwks.json
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
