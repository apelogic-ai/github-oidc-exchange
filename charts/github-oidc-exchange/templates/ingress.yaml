{{- if .Values.ingress.enabled }}
{{- $backendProtocol := default "HTTP" (index .Values.ingress.annotations "alb.ingress.kubernetes.io/backend-protocol") }}
{{- if ne $backendProtocol "HTTP" }}
{{- fail "public Ingress backend must use the dedicated HTTP listener" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "github-oidc-exchange.name" . }}
  labels:
    {{- include "github-oidc-exchange.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ required "ingress.tls.secretName is required" .Values.ingress.tls.secretName }}
  rules:
    - host: {{ required "ingress.host is required when ingress is enabled" .Values.ingress.host }}
      http:
        paths:
          - path: /.well-known/openid-configuration
            pathType: Exact
            backend: &backend
              service:
                name: {{ include "github-oidc-exchange.name" . }}
                port:
                  name: http
          - path: /jwks.json
            pathType: Exact
            backend: *backend
          - path: /v1/exchange
            pathType: Exact
            backend: *backend
{{- end }}
