# This is a copyable values shape, not an install profile. It intentionally
# fails validation until image.repository and image.digest are populated from
# a verified release-manifest.json or a verified mirror descriptor. For a real
# deployment, start with values.example.yaml and the baseline quickstart.
# Replace every example.invalid value, object reference, CIDR, revision, pull
# Secret, and Gateway reference. It cannot be a working issuer as-is.

image:
  # Replace these rejected placeholders together from the selected release
  # handoff or verified mirror. A tag is optional when the digest is pinned.
  repository: replace-with-release-image-repository
  tag: ""
  digest: replace-with-release-image-digest
  pullPolicy: IfNotPresent
  # For a private registry, reference a pre-created image-pull secret. Do not
  # place credentials in Helm values.
  pullSecrets:
    - name: acme-registry-pull

serviceAccount:
  create: true
  name: github-oidc-exchange
  annotations: {}

config:
  issuerUrl: https://identity.example.org
  githubExchangeAudience: acme-github-oidc-exchange
  outputAudience: steward-task-api
  # v5 remains the default. Set this to v6 only with a separate v6 ConfigMap.
  policyContract: github-oidc-exchange.apelogic.io/v5
  policyConfigMapName: github-oidc-exchange-policy
  policyConfigMapKey: policy.json
  keyringSecretName: github-oidc-exchange-keyring
  keyringSecretKey: keyring.json
  keyExpiryReadinessThresholdSeconds: 604800

# Bump only the matching revision after the referenced projected object has
# been verified in the cluster. These opaque values must never contain secret
# content or be derived from it.
rolloutRevisions:
  githubPolicy: rev-1
  githubKeyring: rev-1

rolloutAutomation:
  reloader:
    # Enable only after installing and governing Stakater Reloader cluster-wide.
    enabled: false

# Gateway API is preferred. The Gateway and its TLS policy are platform-owned;
# this route owns only the four public Identity paths. Replace the parent ref
# with the platform Gateway listener that accepts this namespace and hostname.
httpRoute:
  enabled: true
  annotations: {}
  parentRefs:
    - name: public-https
      namespace: gateway-system
      sectionName: https
  hostnames:
    - identity.example.org

networkPolicy:
  enabled: true
  # Replace with the trusted ingress/load-balancer source range for this
  # cluster. Do not use 0.0.0.0/0 for an identity issuer.
  ingressCidrs:
    - 10.0.0.0/16
  # Keep both ports unless the cluster API endpoint contract proves a narrower
  # set. Include pre- and post-DNAT endpoint CIDRs when narrowing the defaults.
  apiServerPorts:
    - 443
    - 6443

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

podDisruptionBudget:
  minAvailable: 1

serviceMonitor:
  enabled: false
  interval: 30s
  # Example for Prometheus Operator discovery, if enabled:
  labels: {}
