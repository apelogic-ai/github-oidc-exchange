replicaCount: 2

image:
  # This is a reserved, non-routable example reference. Select a signed,
  # immutable image digest before installing this chart in any cluster.
  repository: registry.example.invalid/apelogic/github-oidc-exchange
  # Optional immutable release tag for registries that require a SemVer path.
  # The digest remains the authoritative image identity.
  tag: ""
  digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  pullPolicy: IfNotPresent
  # References only; chart values must never contain registry credentials.
  pullSecrets: []

serviceAccount:
  create: true
  name: github-oidc-exchange
  annotations: {}

config:
  # Reserved examples make `helm lint` and `helm template` reproducible while
  # keeping an unconfigured release unable to serve a real identity boundary.
  issuerUrl: https://identity.example.invalid
  githubExchangeAudience: replace-with-dedicated-github-oidc-audience
  outputAudience: steward-task-api
  # These are Kubernetes object references, not policy or key material.
  policyConfigMapName: replace-with-github-policy
  policyConfigMapKey: policy.json
  keyringSecretName: replace-with-github-keyring
  keyringSecretKey: keyring.json

rolloutRevisions:
  githubPolicy: initial
  githubKeyring: initial
  workloadPolicy: ""
  workloadRsaKeyring: ""
  workloadTls: ""
  browserHop1Jwks: ""

workloadExchange:
  enabled: false
  inputAudience: ""
  outputAudience: openshell-api
  policyConfigMapName: ""
  policyConfigMapKey: workload-policy.json
  rsaKeyringSecretName: ""
  rsaKeyringSecretKey: rsa-keyring.json
  tls:
    secretName: ""
    certificateKey: tls.crt
    privateKeyKey: tls.key
  networkPolicy:
    callerNamespaceSelector: {}
    callerPodSelector: {}

# Optional internal-only bridge from a Steward-authenticated browser session to an MCP-GW HOP-1
# bearer. Identity receives a short-lived signed Steward attestation over the workload TLS listener;
# it never receives a browser cookie, session identifier, or provider credential.
browserHop1:
  enabled: false
  stewardIssuer: ""
  assertionAudience: ""
  outputAudience: ""
  stewardJwksConfigMapName: ""
  stewardJwksConfigMapKey: jwks.json

service:
  port: 8080

ingress:
  enabled: false
  className: alb
  annotations: {}
  host: ""

# Gateway API is the preferred public-routing integration. The platform owns
# the Gateway and its TLS policy; this chart emits only the narrow HTTPRoute.
# Set this to false and create an equivalent platform-owned HTTPRoute separately
# when routing is managed outside the release.
httpRoute:
  enabled: false
  annotations: {}
  parentRefs: []
  hostnames: []

networkPolicy:
  enabled: true
  # TEST-NET-1 is intentionally non-production. Replace with the trusted
  # ingress/load-balancer source ranges for the target cluster.
  ingressCidrs:
    - 192.0.2.0/24
  dnsNamespaceSelector:
    kubernetes.io/metadata.name: kube-system
  dnsPodSelector:
    k8s-app: kube-dns
  metricsNamespaceSelector: {}
  metricsPodSelector: {}

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

podDisruptionBudget:
  minAvailable: 1

serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}

nodeSelector: {}
tolerations: []
affinity: {}
