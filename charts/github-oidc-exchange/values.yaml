replicaCount: 2

image:
  # Required: a registry path and immutable digest from a published release
  # handoff or a verified manifest-preserving mirror. Sentinels are rejected.
  repository: ""
  # Optional immutable release tag for registries that require a SemVer path.
  # The digest remains the authoritative image identity.
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
  # References only; chart values must never contain registry credentials.
  pullSecrets: []

serviceAccount:
  create: true
  name: github-oidc-exchange
  annotations: {}

config:
  issuerUrl: ""
  githubExchangeAudience: ""
  outputAudience: steward-task-api
  # The default preserves policy v5 and steward-task-v2. Select v6 only with
  # a separately named v6 ConfigMap and a coordinated consumer rollout.
  policyContract: github-oidc-exchange.apelogic.io/v5
  # These are Kubernetes object references, not policy or key material.
  policyConfigMapName: ""
  policyConfigMapKey: policy.json
  keyringSecretName: ""
  keyringSecretKey: keyring.json
  # Readiness fails this many seconds before either active signing key expires.
  keyExpiryReadinessThresholdSeconds: 604800
  # Cached GitHub signing keys remain usable through transient JWKS outages for
  # this many seconds after the last successful refresh.
  githubJwksMaxStalenessSeconds: 21600

rolloutRevisions:
  # Required controller-free rollout triggers. Change only the entry whose
  # referenced object changed, unless rolloutAutomation.reloader is enabled.
  githubPolicy: rev-1
  githubKeyring: rev-1
  workloadPolicy: ""
  workloadRsaKeyring: ""
  workloadTls: ""
  browserHop1Jwks: ""

rolloutAutomation:
  reloader:
    # Requires an operator-managed Stakater Reloader controller that recognizes
    # the standard named ConfigMap and Secret annotations.
    enabled: false

workloadExchange:
  enabled: false
  inputAudience: ""
  outputAudience: openshell-api
  policyConfigMapName: ""
  policyConfigMapKey: workload-policy.json
  rsaKeyringSecretName: ""
  rsaKeyringSecretKey: rsa-keyring.json
  tls:
    secretName: ""
    certificateKey: tls.crt
    privateKeyKey: tls.key
    certManager:
      enabled: false
      issuerRef:
        name: ""
        kind: Issuer
        group: cert-manager.io
  networkPolicy:
    callerNamespaceSelector: {}
    callerPodSelector: {}

# Optional internal-only bridge from a Steward-authenticated browser session to an MCP-GW HOP-1
# bearer. Identity receives a short-lived signed Steward attestation over the workload TLS listener;
# it never receives a browser cookie, session identifier, or provider credential.
browserHop1:
  enabled: false
  stewardIssuer: ""
  assertionAudience: ""
  outputAudience: ""
  stewardJwksConfigMapName: ""
  stewardJwksConfigMapKey: jwks.json

service:
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  tls:
    # Existing operator-PKI Secret or a Certificate owned by this release.
    secretName: ""
    certManager:
      enabled: false
      issuerRef:
        name: ""
        kind: Issuer
        group: cert-manager.io

# Gateway API is the preferred public-routing integration. The platform owns
# the Gateway and its TLS policy; this chart emits only the narrow HTTPRoute.
# Set this to false and create an equivalent platform-owned HTTPRoute separately
# when routing is managed outside the release.
httpRoute:
  enabled: false
  annotations: {}
  parentRefs: []
  hostnames: []

networkPolicy:
  enabled: true
  ingressCidrs: []
  dnsNamespaceSelector:
    kubernetes.io/metadata.name: kube-system
  dnsPodSelector:
    k8s-app: kube-dns
  # Optional literal NodeLocal DNSCache addresses, for example
  # 169.254.20.10/32 or fd00::a/128. Selector-based cluster DNS remains on.
  # The same selector/IP peers are admitted for DNS reply traffic because
  # reply destination ports are ephemeral on CNIs that do not retain state.
  dnsIpBlocks: []
  # GitHub OIDC discovery/JWKS and other required HTTPS destinations. The
  # dual-stack defaults preserve the chart's existing unrestricted HTTPS
  # egress while making IPv6 usable.
  httpsEgressCidrs:
    - 0.0.0.0/0
    - ::/0
  # Include both the kubernetes Service address as observed before DNAT and
  # API-server endpoint addresses as observed after DNAT when narrowing these.
  apiServerCidrs:
    - 0.0.0.0/0
    - ::/0
  apiServerPorts:
    - 443
    - 6443
  # Additional complete NetworkPolicy egress rules, such as an HTTPS proxy on
  # a nonstandard port. Prefer narrow CIDRs and ports.
  extraEgress: []
  metricsNamespaceSelector: {} # mandatory nonempty when serviceMonitor.enabled=true
  metricsPodSelector: {} # mandatory nonempty when serviceMonitor.enabled=true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

podDisruptionBudget:
  minAvailable: 1

serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}

nodeSelector: {}
tolerations: []
affinity: {}
