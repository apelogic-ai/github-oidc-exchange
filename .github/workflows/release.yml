name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to publish, without the v prefix
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  packages: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_RELEASE_ROLE_ARN }}
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      IMAGE_REPOSITORY_NAME: ${{ vars.ECR_IMAGE_REPOSITORY }}
      CHART_REPOSITORY_NAME: ${{ vars.ECR_CHART_REPOSITORY }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release request before cloud authentication
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)" == "$REQUESTED_VERSION" ]]
          [[ "$(sed -n 's/^version: //p' charts/github-oidc-exchange/Chart.yaml | head -1)" == "$REQUESTED_VERSION" ]]
          [[ "$(sed -n 's/^appVersion: "\([^"]*\)"/\1/p' charts/github-oidc-exchange/Chart.yaml | head -1)" == "$REQUESTED_VERSION" ]]
          [[ -s "docs/releases/v$REQUESTED_VERSION.md" ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$REQUESTED_VERSION" --jq length)" == 0 ]]
          if gh release view "v$REQUESTED_VERSION" >/dev/null 2>&1; then
            printf 'release v%s already exists\n' "$REQUESTED_VERSION" >&2
            exit 1
          fi
          : "${AWS_REGION:?Set AWS_REGION}"
          : "${AWS_ROLE_ARN:?Set AWS_RELEASE_ROLE_ARN}"
          : "${ECR_REGISTRY:?Set ECR_REGISTRY}"
          : "${IMAGE_REPOSITORY_NAME:?Set ECR_IMAGE_REPOSITORY}"
          : "${CHART_REPOSITORY_NAME:?Set ECR_CHART_REPOSITORY}"
          ghcr_owner="${GITHUB_REPOSITORY_OWNER,,}"
          [[ "$ghcr_owner" =~ ^[a-z0-9][a-z0-9._-]*$ ]]

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt

      - name: Validate runtime smoke contract before cloud authentication
        run: bash scripts/validate-runtime-smoke.sh

      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4.3.1
        with:
          version: v3.17.1

      - name: Verify source and render chart
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features
          bash scripts/validate-release.sh
          helm lint charts/github-oidc-exchange -f charts/github-oidc-exchange/ci/test-values.yaml --strict
          helm template test charts/github-oidc-exchange -f charts/github-oidc-exchange/ci/test-values.yaml > /tmp/rendered.yaml
          grep -q 'readOnlyRootFilesystem: true' /tmp/rendered.yaml
          grep -q 'kind: NetworkPolicy' /tmp/rendered.yaml
          grep -q 'kind: PodDisruptionBudget' /tmp/rendered.yaml

  build-amd64:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_RELEASE_ROLE_ARN }}
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      IMAGE_REFERENCE: ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_IMAGE_REPOSITORY }}
      CANDIDATE_TAG: candidate-${{ inputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}-amd64
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v5.1.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: github-oidc-exchange-amd64-${{ github.run_id }}

      - name: Authenticate to ECR
        shell: bash
        run: aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and publish native amd64 image candidate
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_REFERENCE }}:${{ env.CANDIDATE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=release-amd64
          cache-to: type=gha,mode=max,scope=release-amd64

      - name: Smoke native amd64 image candidate
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: SMOKE_PLATFORM=linux/amd64 bash scripts/smoke-release-container.sh "$IMAGE_REFERENCE@$IMAGE_DIGEST"

  build-arm64:
    needs: preflight
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_RELEASE_ROLE_ARN }}
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      IMAGE_REFERENCE: ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_IMAGE_REPOSITORY }}
      CANDIDATE_TAG: candidate-${{ inputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}-arm64
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v5.1.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: github-oidc-exchange-arm64-${{ github.run_id }}

      - name: Authenticate to ECR
        shell: bash
        run: aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and publish native arm64 image candidate
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ env.IMAGE_REFERENCE }}:${{ env.CANDIDATE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=release-arm64
          cache-to: type=gha,mode=max,scope=release-arm64

      - name: Smoke native arm64 image candidate
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: SMOKE_PLATFORM=linux/arm64 bash scripts/smoke-release-container.sh "$IMAGE_REFERENCE@$IMAGE_DIGEST"

  publish:
    needs:
      - preflight
      - build-amd64
      - build-arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_RELEASE_ROLE_ARN }}
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      IMAGE_REPOSITORY_NAME: ${{ vars.ECR_IMAGE_REPOSITORY }}
      CHART_REPOSITORY_NAME: ${{ vars.ECR_CHART_REPOSITORY }}
      VERSION: ${{ inputs.version }}
      CANDIDATE_TAG: candidate-${{ inputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
      CHART_CANDIDATE_TAG: candidate-${{ inputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
      IMAGE_REFERENCE: ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_IMAGE_REPOSITORY }}
      CHART_REFERENCE: ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_CHART_REPOSITORY }}
      COSIGN_EXPERIMENTAL: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Define public release references
        shell: bash
        run: |
          set -euo pipefail
          ghcr_owner="${GITHUB_REPOSITORY_OWNER,,}"
          [[ "$ghcr_owner" =~ ^[a-z0-9][a-z0-9._-]*$ ]]
          printf 'PUBLIC_IMAGE_REFERENCE=ghcr.io/%s/github-oidc-exchange\n' "$ghcr_owner" >> "$GITHUB_ENV"
          printf 'PUBLIC_CHART_REFERENCE=ghcr.io/%s/charts/github-oidc-exchange\n' "$ghcr_owner" >> "$GITHUB_ENV"

      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4.3.1
        with:
          version: v3.17.1

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: sigstore/cosign-installer@874852de93c66509b01dc7cd80f7a5385182d017 # v4.1.0
        with:
          cosign-release: v3.1.2

      - name: Install pinned ORAS
        shell: bash
        env:
          ORAS_VERSION: 1.3.3
          ORAS_LINUX_AMD64_SHA256: 9ce999f8d2de03fc03968b29d743077a58783e545e5eaa53917ca177352d0e59
        run: |
          set -euo pipefail
          archive="oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          curl -sSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/$archive"
          printf '%s  %s\n' "$ORAS_LINUX_AMD64_SHA256" "$RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/oras-bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/oras-bin" oras
          printf '%s\n' "$RUNNER_TEMP/oras-bin" >> "$GITHUB_PATH"

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v5.1.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: github-oidc-exchange-${{ github.run_id }}

      - name: Authenticate to ECR
        shell: bash
        run: aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Reject existing immutable release tags
        shell: bash
        run: |
          set -euo pipefail
          for repository in "$IMAGE_REPOSITORY_NAME" "$CHART_REPOSITORY_NAME"; do
            existing="$(aws ecr batch-get-image --repository-name "$repository" --image-ids imageTag="$VERSION" --query 'images[0].imageId.imageDigest' --output text)"
            [[ "$existing" == None ]]
          done

      - name: Compose native multi-platform image candidate
        id: image
        shell: bash
        env:
          AMD64_DIGEST: ${{ needs.build-amd64.outputs.digest }}
          ARM64_DIGEST: ${{ needs.build-arm64.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$AMD64_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$ARM64_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA" \
            --annotation "index:org.opencontainers.image.version=$VERSION" \
            --tag "$IMAGE_REFERENCE:$CANDIDATE_TAG" \
            "$IMAGE_REFERENCE@$AMD64_DIGEST" \
            "$IMAGE_REFERENCE@$ARM64_DIGEST"
          digest="$(aws ecr batch-get-image \
            --repository-name "$IMAGE_REPOSITORY_NAME" \
            --image-ids imageTag="$CANDIDATE_TAG" \
            --query 'images[0].imageId.imageDigest' \
            --output text)"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          mkdir -p dist
          docker buildx imagetools inspect --raw "$IMAGE_REFERENCE@$digest" > dist/image-index.json
          jq -e \
            --arg amd64 "$AMD64_DIGEST" \
            --arg arm64 "$ARM64_DIGEST" \
            '([.manifests[] | select(.platform.os == "linux")] | length) == 2
             and ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64" and .digest == $amd64)] | length) == 1
             and ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64" and .digest == $arm64)] | length) == 1' \
            dist/image-index.json > /dev/null
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Package and scan chart locally
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist /tmp/chart-scan
          helm package charts/github-oidc-exchange --destination dist --version "$VERSION" --app-version "$VERSION"
          tar -xzf "dist/github-oidc-exchange-$VERSION.tgz" -C /tmp/chart-scan
          jq -n --arg version "$VERSION" '{
            name: "github-oidc-exchange",
            version: $version,
            description: "Platform OIDC exchange issuer for GitHub and Kubernetes workload identity",
            apiVersion: "v2",
            appVersion: $version,
            kubeVersion: ">=1.30.0-0",
            type: "application"
          }' > dist/chart-config.json

      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: ${{ env.IMAGE_REFERENCE }}@${{ steps.image.outputs.digest }}
          format: json
          output: dist/image.trivy.json
          exit-code: "1"
          severity: CRITICAL

      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          scan-type: fs
          scan-ref: /tmp/chart-scan
          format: json
          output: dist/chart.trivy.json
          exit-code: "1"
          severity: CRITICAL

      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.22.2
        with:
          image: ${{ env.IMAGE_REFERENCE }}@${{ steps.image.outputs.digest }}
          format: spdx-json
          output-file: dist/image.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.22.2
        with:
          path: /tmp/chart-scan
          format: spdx-json
          output-file: dist/chart.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Enforce clean ECR scans on every runnable platform manifest
        shell: bash
        run: |
          set -euo pipefail
          image="$IMAGE_REFERENCE@${{ steps.image.outputs.digest }}"
          docker buildx imagetools inspect --raw "$image" > dist/image-index.json
          for architecture in amd64 arm64; do
            platform_digest="$(jq -r --arg architecture "$architecture" '
              [.manifests[]?
                | select(.platform.os == "linux" and .platform.architecture == $architecture)
                | select((.annotations["vnd.docker.reference.type"] // "") != "attestation-manifest")
                | .digest] | unique | if length == 1 then .[0] else empty end
            ' dist/image-index.json)"
            [[ "$platform_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            if [[ "$architecture" == amd64 ]]; then
              expected="${{ needs.build-amd64.outputs.digest }}"
            else
              expected="${{ needs.build-arm64.outputs.digest }}"
            fi
            [[ "$platform_digest" == "$expected" ]]
            aws ecr wait image-scan-complete --repository-name "$IMAGE_REPOSITORY_NAME" --image-id imageDigest="$platform_digest"
            aws ecr describe-image-scan-findings --repository-name "$IMAGE_REPOSITORY_NAME" --image-id imageDigest="$platform_digest" --output json > "dist/image.ecr-scan-$architecture.json"
            [[ "$(jq -r '.imageScanFindings.findingSeverityCounts.CRITICAL // 0' "dist/image.ecr-scan-$architecture.json")" == 0 ]]
            printf '%s\n' "$platform_digest" > "dist/image-platform-$architecture.digest"
          done
          jq -n \
            --rawfile amd64 dist/image-platform-amd64.digest \
            --rawfile arm64 dist/image-platform-arm64.digest \
            '{linux:{amd64:($amd64 | rtrimstr("\n")),arm64:($arm64 | rtrimstr("\n"))}}' \
            > dist/image-platforms.json

      - name: Publish unique immutable chart candidate
        id: chart
        shell: bash
        run: |
          set -euo pipefail
          created="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          oras push --image-spec v1.0 \
            --config dist/chart-config.json:application/vnd.cncf.helm.config.v1+json \
            --annotation "org.opencontainers.image.created=$created" \
            --annotation "org.opencontainers.image.description=Platform OIDC exchange issuer for GitHub and Kubernetes workload identity" \
            --annotation "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --annotation "org.opencontainers.image.title=github-oidc-exchange" \
            --annotation "org.opencontainers.image.version=$VERSION" \
            --format json \
            "$CHART_REFERENCE:$CHART_CANDIDATE_TAG" \
            "dist/github-oidc-exchange-$VERSION.tgz:application/vnd.cncf.helm.chart.content.v1.tar+gzip" \
            > dist/chart-candidate.json
          digest="$(jq -r '.digest' dist/chart-candidate.json)"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          registry_digest="$(aws ecr describe-images \
            --repository-name "$CHART_REPOSITORY_NAME" \
            --image-ids imageTag="$CHART_CANDIDATE_TAG" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          [[ "$registry_digest" == "$digest" ]]
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$digest" > dist/chart.digest

      - name: Generate SLSA v1 provenance predicates
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg source "https://github.com/$GITHUB_REPOSITORY" --arg commit "$GITHUB_SHA" --arg workflow "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF" --arg invocation "$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" --arg version "$VERSION" '{
              buildDefinition: {
                buildType: "https://apelogic.ai/build-types/github-actions-release/v1",
                externalParameters: {source:$source, commit:$commit, version:$version}
              },
              runDetails: {
                builder: {id:$workflow},
                metadata: {invocationId:$invocation}
              }
            }' > dist/release.slsa.json

      - name: Sign, attest, and verify immutable candidate artifacts
        shell: bash
        run: |
          set -euo pipefail
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
          issuer="https://token.actions.githubusercontent.com"
          image="$IMAGE_REFERENCE@${{ steps.image.outputs.digest }}"
          chart="$CHART_REFERENCE@${{ steps.chart.outputs.digest }}"
          for artifact in image chart; do
            if [[ "$artifact" == image ]]; then
              reference="$image"
            else
              reference="$chart"
            fi
            cosign sign --yes --bundle "dist/$artifact-signature.sigstore.json" --new-bundle-format=true --registry-referrers-mode=oci-1-1 "$reference"
            cosign attest --yes --new-bundle-format=true --type spdxjson --predicate "dist/$artifact.spdx.json" "$reference"
            cosign attest --yes --new-bundle-format=true --type slsaprovenance1 --predicate dist/release.slsa.json "$reference"
            cosign verify --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" --experimental-oci11=true --new-bundle-format=true "$reference" > /dev/null
            cosign verify-attestation --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" --experimental-oci11=true --new-bundle-format=true --type spdxjson "$reference" > /dev/null
            cosign verify-attestation --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" --experimental-oci11=true --new-bundle-format=true --type slsaprovenance1 "$reference" > /dev/null
          done

      - name: Promote verified image candidate
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "$IMAGE_REFERENCE:$VERSION" "$IMAGE_REFERENCE@${{ steps.image.outputs.digest }}"
          published="$(aws ecr batch-get-image --repository-name "$IMAGE_REPOSITORY_NAME" --image-ids imageTag="$VERSION" --query 'images[0].imageId.imageDigest' --output text)"
          [[ "$published" == "${{ steps.image.outputs.digest }}" ]]

      - name: Promote verified chart candidate
        shell: bash
        run: |
          set -euo pipefail
          oras tag "$CHART_REFERENCE@${{ steps.chart.outputs.digest }}" "$VERSION"
          published="$(aws ecr batch-get-image \
            --repository-name "$CHART_REPOSITORY_NAME" \
            --image-ids imageTag="$VERSION" \
            --query 'images[0].imageId.imageDigest' \
            --output text)"
          [[ "$published" == "${{ steps.chart.outputs.digest }}" ]]
          mkdir -p /tmp/promoted-chart
          helm pull "oci://$CHART_REFERENCE" --version "$VERSION" --destination /tmp/promoted-chart
          cmp "dist/github-oidc-exchange-$VERSION.tgz" \
            "/tmp/promoted-chart/github-oidc-exchange-$VERSION.tgz"

      - name: Authenticate to GitHub Container Registry
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Mirror verified immutable ECR artifacts to GHCR
        id: public
        shell: bash
        run: |
          set -euo pipefail
          source_image="$IMAGE_REFERENCE@${{ steps.image.outputs.digest }}"
          source_chart="$CHART_REFERENCE@${{ steps.chart.outputs.digest }}"
          oras cp "$source_image" "$PUBLIC_IMAGE_REFERENCE:$VERSION"
          oras cp "$source_chart" "$PUBLIC_CHART_REFERENCE:$VERSION"
          image_digest="$(oras manifest fetch --descriptor "$PUBLIC_IMAGE_REFERENCE:$VERSION" | jq -r '.digest')"
          chart_digest="$(oras manifest fetch --descriptor "$PUBLIC_CHART_REFERENCE:$VERSION" | jq -r '.digest')"
          [[ "$image_digest" == "${{ steps.image.outputs.digest }}" ]]
          [[ "$chart_digest" == "${{ steps.chart.outputs.digest }}" ]]
          printf 'image_digest=%s\n' "$image_digest" >> "$GITHUB_OUTPUT"
          printf 'chart_digest=%s\n' "$chart_digest" >> "$GITHUB_OUTPUT"

      - name: Verify mirrored GHCR packages remain public
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for package in github-oidc-exchange charts%2Fgithub-oidc-exchange; do
            visibility="$(gh api "orgs/$owner/packages/container/$package" --jq .visibility)"
            [[ "$visibility" == public ]]
          done

      - name: Sign, attest, and verify public GHCR artifacts
        shell: bash
        run: |
          set -euo pipefail
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
          issuer="https://token.actions.githubusercontent.com"
          public_image="$PUBLIC_IMAGE_REFERENCE@${{ steps.public.outputs.image_digest }}"
          public_chart="$PUBLIC_CHART_REFERENCE@${{ steps.public.outputs.chart_digest }}"
          for artifact in public-image public-chart; do
            if [[ "$artifact" == public-image ]]; then
              reference="$public_image"
              sbom=dist/image.spdx.json
            else
              reference="$public_chart"
              sbom=dist/chart.spdx.json
            fi
            cosign sign --yes --bundle "dist/$artifact-signature.sigstore.json" --new-bundle-format=true --registry-referrers-mode=oci-1-1 "$reference"
            cosign attest --yes --new-bundle-format=true --type spdxjson --predicate "$sbom" "$reference"
            cosign attest --yes --new-bundle-format=true --type slsaprovenance1 --predicate dist/release.slsa.json "$reference"
            cosign verify --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" --experimental-oci11=true --new-bundle-format=true "$reference" > /dev/null
            cosign verify-attestation --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" --experimental-oci11=true --new-bundle-format=true --type spdxjson "$reference" > /dev/null
            cosign verify-attestation --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" --experimental-oci11=true --new-bundle-format=true --type slsaprovenance1 "$reference" > /dev/null
          done

      - name: Verify anonymous exact-digest GHCR pulls
        shell: bash
        run: |
          set -euo pipefail
          public_image="$PUBLIC_IMAGE_REFERENCE@${{ steps.public.outputs.image_digest }}"
          public_chart="$PUBLIC_CHART_REFERENCE@${{ steps.public.outputs.chart_digest }}"
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
          issuer="https://token.actions.githubusercontent.com"
          docker logout ghcr.io || true
          helm registry logout ghcr.io || true
          oras logout ghcr.io || true
          docker pull "$public_image"
          docker image inspect "$public_image" --format '{{json .RepoDigests}}' | jq -e --arg ref "$public_image" 'index($ref) != null' > /dev/null
          image_digest="$(oras manifest fetch --descriptor "$public_image" | jq -r '.digest')"
          chart_digest="$(oras manifest fetch --descriptor "$public_chart" | jq -r '.digest')"
          [[ "$image_digest" == "${{ steps.public.outputs.image_digest }}" ]]
          [[ "$chart_digest" == "${{ steps.public.outputs.chart_digest }}" ]]
          mkdir -p /tmp/public-chart
          helm pull "oci://$PUBLIC_CHART_REFERENCE" --version "$VERSION" --destination /tmp/public-chart
          cmp "dist/github-oidc-exchange-$VERSION.tgz" \
            "/tmp/public-chart/github-oidc-exchange-$VERSION.tgz"
          cosign verify --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" --experimental-oci11=true --new-bundle-format=true "$public_image" > /dev/null
          cosign verify-attestation --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" --experimental-oci11=true --new-bundle-format=true --type spdxjson "$public_image" > /dev/null
          cosign verify-attestation --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" --experimental-oci11=true --new-bundle-format=true --type slsaprovenance1 "$public_image" > /dev/null
          cosign verify --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" --experimental-oci11=true --new-bundle-format=true "$public_chart" > /dev/null
          cosign verify-attestation --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" --experimental-oci11=true --new-bundle-format=true --type spdxjson "$public_chart" > /dev/null
          cosign verify-attestation --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" --experimental-oci11=true --new-bundle-format=true --type slsaprovenance1 "$public_chart" > /dev/null

      - name: Publish signed release handoff
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          policy_contract="$(sed -n 's/^pub const POLICY_VERSION: &str = "\([^"]*\)";/\1/p' src/lib.rs)"
          identity_contract="$(sed -n 's/^pub const IDENTITY_CONTRACT: &str = "\([^"]*\)";/\1/p' src/lib.rs)"
          source_auth_policy_contract="$(sed -n 's/^pub const SOURCE_AUTH_POLICY_VERSION: &str = "\([^"]*\)";/\1/p' src/lib.rs)"
          source_auth_identity_contract="$(sed -n 's/^pub const SOURCE_AUTH_IDENTITY_CONTRACT: &str = "\([^"]*\)";/\1/p' src/lib.rs)"
          [[ -n "$policy_contract" && -n "$identity_contract" && -n "$source_auth_policy_contract" && -n "$source_auth_identity_contract" ]]
          jq -n \
            --arg version "$VERSION" \
            --arg commit "$GITHUB_SHA" \
            --arg release_url "https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION" \
            --arg workflow_run_url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg image "$PUBLIC_IMAGE_REFERENCE@${{ steps.public.outputs.image_digest }}" \
            --arg chart "$PUBLIC_CHART_REFERENCE@${{ steps.public.outputs.chart_digest }}" \
            --arg ecr_image "$IMAGE_REFERENCE@${{ steps.image.outputs.digest }}" \
            --arg ecr_chart "$CHART_REFERENCE@${{ steps.chart.outputs.digest }}" \
            --arg public_image_digest "${{ steps.public.outputs.image_digest }}" \
            --arg public_chart_digest "${{ steps.public.outputs.chart_digest }}" \
            --arg ecr_image_digest "${{ steps.image.outputs.digest }}" \
            --arg ecr_chart_digest "${{ steps.chart.outputs.digest }}" \
            --arg policy_contract "$policy_contract" \
            --arg identity_contract "$identity_contract" \
            --arg source_auth_policy_contract "$source_auth_policy_contract" \
            --arg source_auth_identity_contract "$source_auth_identity_contract" \
            --slurpfile platforms dist/image-platforms.json \
            '{version:$version,commit:$commit,release_url:$release_url,workflow_run_url:$workflow_run_url,image:$image,chart:$chart,ecr_image:$ecr_image,ecr_chart:$ecr_chart,public_image_digest:$public_image_digest,public_chart_digest:$public_chart_digest,ecr_image_digest:$ecr_image_digest,ecr_chart_digest:$ecr_chart_digest,image_platforms:$platforms[0],public_distribution:{registry:"ghcr.io",anonymous_pull_verified:true,byte_identical_to_ecr:true},policy_contract:$policy_contract,identity_contract:$identity_contract,supported_policy_contracts:[$policy_contract,$source_auth_policy_contract],supported_identity_contracts:[$identity_contract,$source_auth_identity_contract]}' \
            > dist/release-manifest.json
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
          cosign sign-blob --yes --bundle dist/release-manifest.sigstore.json dist/release-manifest.json
          cosign verify-blob --bundle dist/release-manifest.sigstore.json --certificate-identity "$identity" --certificate-oidc-issuer https://token.actions.githubusercontent.com dist/release-manifest.json
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "github-oidc-exchange v$VERSION" --notes-file "docs/releases/v$VERSION.md" dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && hashFiles('dist/*') != '' }}
        with:
          name: github-oidc-exchange-${{ inputs.version }}-release-evidence
          path: dist/
          if-no-files-found: error
