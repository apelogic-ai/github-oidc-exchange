name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to publish, without the v prefix
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  packages: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      image: ${{ steps.refs.outputs.image }}
      chart: ${{ steps.refs.outputs.chart }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release request
        id: refs
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)" == "$REQUESTED_VERSION" ]]
          [[ "$(sed -n 's/^version: //p' charts/github-oidc-exchange/Chart.yaml | head -1)" == "$REQUESTED_VERSION" ]]
          [[ "$(sed -n 's/^appVersion: "\([^"]*\)"/\1/p' charts/github-oidc-exchange/Chart.yaml | head -1)" == "$REQUESTED_VERSION" ]]
          [[ -s "docs/releases/v$REQUESTED_VERSION.md" ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$REQUESTED_VERSION" --jq length)" == 0 ]]
          if gh release view "v$REQUESTED_VERSION" >/dev/null 2>&1; then
            printf 'release v%s already exists\n' "$REQUESTED_VERSION" >&2
            exit 1
          fi
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          [[ "$owner" =~ ^[a-z0-9][a-z0-9._-]*$ ]]
          printf 'image=ghcr.io/%s/github-oidc-exchange\n' "$owner" >> "$GITHUB_OUTPUT"
          printf 'chart=ghcr.io/%s/charts/github-oidc-exchange\n' "$owner" >> "$GITHUB_OUTPUT"

      - name: Install pinned ORAS for immutable-version preflight
        shell: bash
        env:
          ORAS_VERSION: 1.3.3
          ORAS_LINUX_AMD64_SHA256: 9ce999f8d2de03fc03968b29d743077a58783e545e5eaa53917ca177352d0e59
        run: |
          set -euo pipefail
          archive="oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          curl -sSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/$archive"
          printf '%s  %s\n' "$ORAS_LINUX_AMD64_SHA256" "$RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/oras-preflight"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/oras-preflight" oras
          printf '%s\n' "$RUNNER_TEMP/oras-preflight" >> "$GITHUB_PATH"

      - name: Reject existing immutable release tags before builds
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_REFERENCE: ${{ steps.refs.outputs.image }}
          CHART_REFERENCE: ${{ steps.refs.outputs.chart }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          if oras manifest fetch --descriptor "$IMAGE_REFERENCE:$VERSION" >/dev/null 2>&1 ||
             oras manifest fetch --descriptor "$CHART_REFERENCE:$VERSION" >/dev/null 2>&1; then
            printf 'version tag already exists; never overwrite published artifacts\n' >&2
            exit 1
          fi

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt

      - name: Validate runtime smoke contract
        run: bash scripts/validate-runtime-smoke.sh

      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4.3.1
        with:
          version: v3.17.1

      - name: Verify source and render chart
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features
          bash scripts/validate-release.sh
          helm lint charts/github-oidc-exchange -f charts/github-oidc-exchange/ci/test-values.yaml --strict
          helm template test charts/github-oidc-exchange -f charts/github-oidc-exchange/ci/test-values.yaml > /tmp/rendered.yaml
          grep -q 'readOnlyRootFilesystem: true' /tmp/rendered.yaml
          grep -q 'kind: NetworkPolicy' /tmp/rendered.yaml
          grep -q 'kind: PodDisruptionBudget' /tmp/rendered.yaml

  build-amd64:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"
      DOCKER_BUILD_SUMMARY: "false"
      IMAGE_REFERENCE: ${{ needs.preflight.outputs.image }}
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Authenticate to GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build and publish native amd64 image candidate
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          outputs: type=image,name=${{ env.IMAGE_REFERENCE }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=release-amd64
          cache-to: type=gha,mode=max,scope=release-amd64
      - name: Smoke native amd64 image candidate
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: SMOKE_PLATFORM=linux/amd64 bash scripts/smoke-release-container.sh "$IMAGE_REFERENCE@$IMAGE_DIGEST"

  build-arm64:
    needs: preflight
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"
      DOCKER_BUILD_SUMMARY: "false"
      IMAGE_REFERENCE: ${{ needs.preflight.outputs.image }}
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Authenticate to GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build and publish native arm64 image candidate
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/arm64
          outputs: type=image,name=${{ env.IMAGE_REFERENCE }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=release-arm64
          cache-to: type=gha,mode=max,scope=release-arm64
      - name: Smoke native arm64 image candidate
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: SMOKE_PLATFORM=linux/arm64 bash scripts/smoke-release-container.sh "$IMAGE_REFERENCE@$IMAGE_DIGEST"

  publish:
    needs: [preflight, build-amd64, build-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"
      DOCKER_BUILD_SUMMARY: "false"
      VERSION: ${{ inputs.version }}
      IMAGE_REFERENCE: ${{ needs.preflight.outputs.image }}
      CHART_REFERENCE: ${{ needs.preflight.outputs.chart }}
      COSIGN_EXPERIMENTAL: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4.3.1
        with:
          version: v3.17.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: sigstore/cosign-installer@874852de93c66509b01dc7cd80f7a5385182d017 # v4.1.0
        with:
          cosign-release: v3.1.2
      - name: Install pinned ORAS
        shell: bash
        env:
          ORAS_VERSION: 1.3.3
          ORAS_LINUX_AMD64_SHA256: 9ce999f8d2de03fc03968b29d743077a58783e545e5eaa53917ca177352d0e59
        run: |
          set -euo pipefail
          archive="oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          curl -sSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/$archive"
          printf '%s  %s\n' "$ORAS_LINUX_AMD64_SHA256" "$RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/oras-bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/oras-bin" oras
          printf '%s\n' "$RUNNER_TEMP/oras-bin" >> "$GITHUB_PATH"
      - name: Authenticate to GitHub Container Registry
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Compose native multi-platform image candidate
        id: image
        shell: bash
        env:
          AMD64_DIGEST: ${{ needs.build-amd64.outputs.digest }}
          ARM64_DIGEST: ${{ needs.build-arm64.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$AMD64_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$ARM64_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          mkdir -p dist
          oras manifest index create "$IMAGE_REFERENCE" \
            "$AMD64_DIGEST" "$ARM64_DIGEST" \
            --annotation "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --annotation "org.opencontainers.image.revision=$GITHUB_SHA" \
            --annotation "org.opencontainers.image.version=$VERSION" \
            --output dist/image-index.json
          digest="sha256:$(sha256sum dist/image-index.json | cut -d' ' -f1)"
          published="$(oras manifest push --descriptor \
            --media-type application/vnd.oci.image.index.v1+json \
            "$IMAGE_REFERENCE@$digest" dist/image-index.json | jq -r '.digest')"
          [[ "$published" == "$digest" ]]
          jq -e \
            --arg amd64 "$AMD64_DIGEST" \
            --arg arm64 "$ARM64_DIGEST" \
            '([.manifests[] | select(.platform.os == "linux")] | length) == 2
             and ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64" and .digest == $amd64)] | length) == 1
             and ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64" and .digest == $arm64)] | length) == 1' \
            dist/image-index.json > /dev/null
          printf '%s\n' "$AMD64_DIGEST" > dist/image-platform-amd64.digest
          printf '%s\n' "$ARM64_DIGEST" > dist/image-platform-arm64.digest
          jq -n --arg amd64 "$AMD64_DIGEST" --arg arm64 "$ARM64_DIGEST" \
            '{linux:{amd64:$amd64,arm64:$arm64}}' > dist/image-platforms.json
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Scan native amd64 image digest with Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: ${{ env.IMAGE_REFERENCE }}@${{ needs.build-amd64.outputs.digest }}
          format: json
          output: ${{ runner.temp }}/image-amd64.trivy.json
          exit-code: "1"
          severity: CRITICAL
      - name: Scan native arm64 image digest with Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: ${{ env.IMAGE_REFERENCE }}@${{ needs.build-arm64.outputs.digest }}
          format: json
          output: ${{ runner.temp }}/image-arm64.trivy.json
          exit-code: "1"
          severity: CRITICAL
      - name: Package chart locally
        shell: bash
        run: |
          set -euo pipefail
          artifacthub_image="$IMAGE_REFERENCE@${{ steps.image.outputs.digest }}"
          [[ "$artifacthub_image" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$ ]]
          sed -i "s|image: replace-with-release-image|image: $artifacthub_image|" \
            charts/github-oidc-exchange/Chart.yaml
          if grep -Fq 'replace-with-release-image' charts/github-oidc-exchange/Chart.yaml; then
            printf 'Artifact Hub image sentinel was not replaced\n' >&2
            exit 1
          fi
          grep -Fq "image: $artifacthub_image" charts/github-oidc-exchange/Chart.yaml
          mkdir -p dist /tmp/chart-scan
          helm package charts/github-oidc-exchange --destination dist --version "$VERSION" --app-version "$VERSION"
          tar -xzf "dist/github-oidc-exchange-$VERSION.tgz" -C /tmp/chart-scan
          kube_version="$(sed -n 's/^kubeVersion: *"\([^"]*\)"/\1/p' charts/github-oidc-exchange/Chart.yaml)"
          [[ -n "$kube_version" ]]
          jq -n --arg version "$VERSION" --arg kube_version "$kube_version" '{
            name: "github-oidc-exchange",
            version: $version,
            description: "Platform OIDC exchange issuer for GitHub and Kubernetes workload identity",
            apiVersion: "v2",
            appVersion: $version,
            kubeVersion: $kube_version,
            type: "application"
          }' > "$RUNNER_TEMP/chart-config.json"
      - name: Scan packaged chart with Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          scan-type: fs
          scan-ref: /tmp/chart-scan
          format: json
          output: ${{ runner.temp }}/chart.trivy.json
          exit-code: "1"
          severity: CRITICAL
      - name: Publish unique immutable chart candidate
        id: chart
        shell: bash
        run: |
          set -euo pipefail
          oras push --image-spec v1.0 \
            --config "$RUNNER_TEMP/chart-config.json":application/vnd.cncf.helm.config.v1+json \
            --annotation "org.opencontainers.image.description=Platform OIDC exchange issuer for GitHub and Kubernetes workload identity" \
            --annotation "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --annotation "org.opencontainers.image.title=github-oidc-exchange" \
            --annotation "org.opencontainers.image.version=$VERSION" \
            --format json \
            "$CHART_REFERENCE" \
            "dist/github-oidc-exchange-$VERSION.tgz:application/vnd.cncf.helm.chart.content.v1.tar+gzip" \
            > "$RUNNER_TEMP/chart-candidate.json"
          digest="$(jq -r '.digest' "$RUNNER_TEMP/chart-candidate.json")"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          published="$(oras manifest fetch --descriptor "$CHART_REFERENCE@$digest" | jq -r '.digest')"
          [[ "$published" == "$digest" ]]
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$digest" > dist/chart.digest
      - name: Generate image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.22.2
        with:
          image: ${{ env.IMAGE_REFERENCE }}@${{ steps.image.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/image.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate chart SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.22.2
        with:
          path: /tmp/chart-scan
          format: spdx-json
          output-file: ${{ runner.temp }}/chart.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate SLSA v1 provenance predicate
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg source "https://github.com/$GITHUB_REPOSITORY" --arg commit "$GITHUB_SHA" --arg workflow "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF" --arg invocation "$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" --arg version "$VERSION" '{
              buildDefinition: {
                buildType: "https://apelogic.ai/build-types/github-actions-release/v1",
                externalParameters: {source:$source, commit:$commit, version:$version}
              },
              runDetails: {
                builder: {id:$workflow},
                metadata: {invocationId:$invocation}
              }
            }' > dist/release.slsa.json
      - name: Sign, attest, and verify immutable GHCR artifacts
        shell: bash
        run: |
          set -euo pipefail
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
          issuer="https://token.actions.githubusercontent.com"
          image="$IMAGE_REFERENCE@${{ steps.image.outputs.digest }}"
          chart="$CHART_REFERENCE@${{ steps.chart.outputs.digest }}"
          for artifact in image chart; do
            if [[ "$artifact" == image ]]; then
              reference="$image"
              bundle=dist/public-image-signature.sigstore.json
            else
              reference="$chart"
              bundle=dist/public-chart-signature.sigstore.json
            fi
            cosign sign --yes --bundle "$bundle" --new-bundle-format=true --registry-referrers-mode=oci-1-1 "$reference"
            cosign attest --yes --new-bundle-format=true --type spdxjson --predicate "$RUNNER_TEMP/$artifact.spdx.json" "$reference"
            cosign attest --yes --new-bundle-format=true --type slsaprovenance1 --predicate dist/release.slsa.json "$reference"
            cosign verify --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" --experimental-oci11=true --new-bundle-format=true "$reference" > /dev/null
            cosign verify-attestation --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" --experimental-oci11=true --new-bundle-format=true --type spdxjson "$reference" > /dev/null
            cosign verify-attestation --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" --experimental-oci11=true --new-bundle-format=true --type slsaprovenance1 "$reference" > /dev/null
          done
      - name: Publish signed version tags
        shell: bash
        run: |
          set -euo pipefail
          oras tag "$IMAGE_REFERENCE@${{ steps.image.outputs.digest }}" "$VERSION"
          oras tag "$CHART_REFERENCE@${{ steps.chart.outputs.digest }}" "$VERSION"
          image_digest="$(oras manifest fetch --descriptor "$IMAGE_REFERENCE:$VERSION" | jq -r '.digest')"
          chart_digest="$(oras manifest fetch --descriptor "$CHART_REFERENCE:$VERSION" | jq -r '.digest')"
          [[ "$image_digest" == "${{ steps.image.outputs.digest }}" ]]
          [[ "$chart_digest" == "${{ steps.chart.outputs.digest }}" ]]
          mkdir -p /tmp/published-chart
          helm pull "oci://$CHART_REFERENCE" --version "$VERSION" --destination /tmp/published-chart
          cmp "dist/github-oidc-exchange-$VERSION.tgz" \
            "/tmp/published-chart/github-oidc-exchange-$VERSION.tgz"
      - name: Publish Artifact Hub repository metadata
        id: artifacthub
        shell: bash
        run: |
          set -euo pipefail
          metadata_ref="$CHART_REFERENCE:artifacthub.io"
          metadata_file=charts/github-oidc-exchange/artifacthub-repo.yml
          oras push "$metadata_ref" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "$metadata_file:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"
          metadata_digest="$(oras manifest fetch --descriptor "$metadata_ref" | jq -r '.digest')"
          [[ "$metadata_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          oras manifest fetch "$metadata_ref" | jq -e '
            .config.mediaType == "application/vnd.cncf.artifacthub.config.v1+yaml" and
            ([.layers[] | select(.mediaType == "application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml")] | length) == 1
          ' >/dev/null
          printf 'digest=%s\n' "$metadata_digest" >> "$GITHUB_OUTPUT"
      - name: Verify GHCR packages remain public
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for package in github-oidc-exchange charts%2Fgithub-oidc-exchange; do
            visibility="$(gh api "orgs/$owner/packages/container/$package" --jq .visibility)"
            [[ "$visibility" == public ]]
          done
      - name: Verify anonymous exact-digest GHCR pulls
        shell: bash
        run: |
          set -euo pipefail
          image="$IMAGE_REFERENCE@${{ steps.image.outputs.digest }}"
          chart="$CHART_REFERENCE@${{ steps.chart.outputs.digest }}"
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
          issuer="https://token.actions.githubusercontent.com"
          docker logout ghcr.io || true
          helm registry logout ghcr.io || true
          oras logout ghcr.io || true
          docker pull "$image"
          docker image inspect "$image" --format '{{json .RepoDigests}}' | jq -e --arg ref "$image" 'index($ref) != null' > /dev/null
          image_digest="$(oras manifest fetch --descriptor "$image" | jq -r '.digest')"
          chart_digest="$(oras manifest fetch --descriptor "$chart" | jq -r '.digest')"
          artifacthub_digest="$(oras manifest fetch --descriptor "$CHART_REFERENCE:artifacthub.io" | jq -r '.digest')"
          [[ "$image_digest" == "${{ steps.image.outputs.digest }}" ]]
          [[ "$chart_digest" == "${{ steps.chart.outputs.digest }}" ]]
          [[ "$artifacthub_digest" == "${{ steps.artifacthub.outputs.digest }}" ]]
          oras manifest fetch "$CHART_REFERENCE:artifacthub.io" | jq -e '
            ([.layers[] | select(.mediaType == "application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml")] | length) == 1
          ' >/dev/null
          mkdir -p /tmp/anonymous-chart
          helm pull "oci://$CHART_REFERENCE" --version "$VERSION" --destination /tmp/anonymous-chart
          cmp "dist/github-oidc-exchange-$VERSION.tgz" \
            "/tmp/anonymous-chart/github-oidc-exchange-$VERSION.tgz"
          cosign verify --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" --experimental-oci11=true --new-bundle-format=true "$image" > /dev/null
          cosign verify-attestation --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" --experimental-oci11=true --new-bundle-format=true --type spdxjson "$image" > /dev/null
          cosign verify-attestation --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" --experimental-oci11=true --new-bundle-format=true --type slsaprovenance1 "$image" > /dev/null
          cosign verify --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" --experimental-oci11=true --new-bundle-format=true "$chart" > /dev/null
          cosign verify-attestation --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" --experimental-oci11=true --new-bundle-format=true --type spdxjson "$chart" > /dev/null
          cosign verify-attestation --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" --experimental-oci11=true --new-bundle-format=true --type slsaprovenance1 "$chart" > /dev/null
      - name: Publish signed release handoff
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/stage-release-contract-assets.sh dist
          policy_contract="$(sed -n 's/^pub const POLICY_VERSION: &str = "\([^"]*\)";/\1/p' src/lib.rs)"
          identity_contract="$(sed -n 's/^pub const IDENTITY_CONTRACT: &str = "\([^"]*\)";/\1/p' src/lib.rs)"
          source_auth_policy_contract="$(sed -n 's/^pub const SOURCE_AUTH_POLICY_VERSION: &str = "\([^"]*\)";/\1/p' src/lib.rs)"
          source_auth_identity_contract="$(sed -n 's/^pub const SOURCE_AUTH_IDENTITY_CONTRACT: &str = "\([^"]*\)";/\1/p' src/lib.rs)"
          [[ -n "$policy_contract" && -n "$identity_contract" && -n "$source_auth_policy_contract" && -n "$source_auth_identity_contract" ]]
          jq -n \
            --arg version "$VERSION" \
            --arg commit "$GITHUB_SHA" \
            --arg release_url "https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION" \
            --arg workflow_run_url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg image "$IMAGE_REFERENCE@${{ steps.image.outputs.digest }}" \
            --arg chart "$CHART_REFERENCE@${{ steps.chart.outputs.digest }}" \
            --arg public_image_digest "${{ steps.image.outputs.digest }}" \
            --arg public_chart_digest "${{ steps.chart.outputs.digest }}" \
            --arg policy_contract "$policy_contract" \
            --arg identity_contract "$identity_contract" \
            --arg source_auth_policy_contract "$source_auth_policy_contract" \
            --arg source_auth_identity_contract "$source_auth_identity_contract" \
            --slurpfile platforms dist/image-platforms.json \
            '{version:$version,commit:$commit,release_url:$release_url,workflow_run_url:$workflow_run_url,image:$image,chart:$chart,public_image_digest:$public_image_digest,public_chart_digest:$public_chart_digest,image_platforms:$platforms[0],public_distribution:{registry:"ghcr.io",anonymous_pull_verified:true,direct_publish:true},policy_contract:$policy_contract,identity_contract:$identity_contract,supported_policy_contracts:[$policy_contract,$source_auth_policy_contract],supported_identity_contracts:[$identity_contract,$source_auth_identity_contract]}' \
            > dist/release-manifest.json
          bash scripts/check-public-release-boundary.sh \
            --evidence dist/release.slsa.json \
            --evidence dist/release-manifest.json \
            --evidence "docs/releases/v$VERSION.md"
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
          cosign sign-blob --yes --bundle dist/release-manifest.sigstore.json dist/release-manifest.json
          cosign verify-blob --bundle dist/release-manifest.sigstore.json --certificate-identity "$identity" --certificate-oidc-issuer https://token.actions.githubusercontent.com dist/release-manifest.json
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "github-oidc-exchange v$VERSION" --notes-file "docs/releases/v$VERSION.md" dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() && hashFiles('dist/*') != '' }}
        with:
          name: github-oidc-exchange-${{ inputs.version }}-release-evidence
          path: dist/
          if-no-files-found: error
