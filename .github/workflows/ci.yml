name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
      - name: Validate runtime smoke contract
        run: bash scripts/validate-runtime-smoke.sh
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4.3.1
        with:
          version: v3.17.1
      - name: Rust quality gates
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features
          bash scripts/validate-release.sh
      - name: Helm contract
        run: |
          helm lint charts/github-oidc-exchange \
            -f charts/github-oidc-exchange/ci/test-values.yaml
          helm lint charts/github-oidc-exchange \
            -f charts/github-oidc-exchange/ci/workload-values.yaml
          helm template test charts/github-oidc-exchange \
            -f charts/github-oidc-exchange/ci/test-values.yaml \
            > /tmp/rendered.yaml
          helm template workload charts/github-oidc-exchange \
            --namespace github-oidc-exchange \
            -f charts/github-oidc-exchange/ci/workload-values.yaml \
            > /tmp/workload.yaml
          grep -q 'readOnlyRootFilesystem: true' /tmp/rendered.yaml
          grep -q 'automountServiceAccountToken: true' /tmp/rendered.yaml
          grep -q 'kind: NetworkPolicy' /tmp/rendered.yaml
          grep -q 'kind: PodDisruptionBudget' /tmp/rendered.yaml
          grep -q 'containerPort: 8080' /tmp/workload.yaml
          grep -q 'containerPort: 8443' /tmp/workload.yaml
          grep -q 'name: workload-https' /tmp/workload.yaml
          grep -q 'port: http' /tmp/workload.yaml
          grep -q 'scheme: http' /tmp/workload.yaml
          grep -q 'resources: \["tokenreviews"\]' /tmp/workload.yaml
          grep -q 'verbs: \["create"\]' /tmp/workload.yaml
          ! grep -q 'path: /v1/workload/exchange' /tmp/workload.yaml
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.6.0
        with:
          platforms: arm64
      - name: Build release image locally
        run: docker buildx build --platform linux/amd64 --load --tag github-oidc-exchange:ci .
      - name: Smoke final release image
        run: bash scripts/smoke-release-container.sh github-oidc-exchange:ci
      - name: Build and smoke arm64 release image
        run: |
          docker buildx build --platform linux/arm64 --load --tag github-oidc-exchange:ci-arm64 .
          SMOKE_PLATFORM=linux/arm64 bash scripts/smoke-release-container.sh github-oidc-exchange:ci-arm64
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: github-oidc-exchange:ci
          format: table
          exit-code: "1"
          severity: CRITICAL

  kubernetes-lease-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install pinned Kind
        run: go install sigs.k8s.io/kind@v0.31.0
      - name: Verify Kubernetes Lease replay semantics against Kind
        run: PATH="$(go env GOPATH)/bin:$PATH" bash scripts/test-kubernetes-lease-replay-kind.sh
