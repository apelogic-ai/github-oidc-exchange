name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
      - name: Rust quality gates
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features
          bash scripts/validate-release.sh
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4.3.1
        with:
          version: v3.17.1
      - name: Helm contract
        run: |
          helm lint charts/github-oidc-exchange -f charts/github-oidc-exchange/ci/test-values.yaml
          helm template test charts/github-oidc-exchange -f charts/github-oidc-exchange/ci/test-values.yaml > /tmp/rendered.yaml
          grep -q 'readOnlyRootFilesystem: true' /tmp/rendered.yaml
          grep -q 'automountServiceAccountToken: true' /tmp/rendered.yaml
          grep -q 'kind: NetworkPolicy' /tmp/rendered.yaml
          grep -q 'kind: PodDisruptionBudget' /tmp/rendered.yaml
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build release image locally
        run: docker buildx build --platform linux/amd64 --load --tag github-oidc-exchange:ci .
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: github-oidc-exchange:ci
          format: table
          exit-code: "1"
          severity: CRITICAL
